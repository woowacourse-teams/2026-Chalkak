spring:
  application:
    name: backend

  config:
    import: "optional:file:.env[.properties]"

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    clean-disabled: true
    default-schema: public
    validate-migration-naming: true

chalkak:
  image:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    base-url: ${CLOUDFRONT_BASE_URL}
    root-prefix: ${S3_PREFIX}
    signature:
      max-bytes: 1048576
      allowed-content-types:
        - image/png
    post:
      max-bytes: 5242880

  post:
    # 이미지 처리 완료 콜백을 언제까지 기다릴지. 이 시간을 넘긴 검수 대기 게시물은 다음 게시물 생성
    # 시점에 거절 처리해, 콜백이 유실돼도 작성자가 같은 주제에 다시 올릴 수 있게 한다.
    # 30m, 1h, PT30M 형식을 모두 받는다.
    image-processing-timeout: ${POST_IMAGE_PROCESSING_TIMEOUT:30m}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls-primary-name: user-api
