spring:
  application:
    name: backend

  config:
    import: "optional:file:.env[.properties]"

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    clean-disabled: true
    default-schema: public
    validate-migration-naming: true

chalkak:
  auth:
    oidc:
      google:
        issuer: https://accounts.google.com
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  image:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    base-url: ${CLOUDFRONT_BASE_URL}
    root-prefix: ${S3_PREFIX}
    signature:
      max-bytes: 1048576
      allowed-content-types:
        - image/png

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls-primary-name: user-api
