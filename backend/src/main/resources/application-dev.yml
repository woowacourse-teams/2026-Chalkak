# 단일 EC2 개발 서버용 프로필. 운영 환경은 application-prod.yml을 사용한다.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true

management:
  endpoint:
    health:
      show-details: never

