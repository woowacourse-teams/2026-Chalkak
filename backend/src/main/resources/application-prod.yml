# 배포 환경 프로필.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true

management:
  endpoint:
    health:
      show-details: never

chalkak:
  analytics:
    aggregation:
      enabled: true
    # 지표에서 뺄 팀원·테스트 계정의 회원 ID. 추가하려면 ID를 이 목록에 넣고 PR을 올려 릴리스한다.
    # 회원 ID는 비밀 값이 아니라 저장소에 둬도 된다. 이메일 같은 개인정보는 적지 않는다.
    # 대시보드 dashboard.json의 실시간 DAU·당일 접속 사용자 위젯도 같은 목록을 쓰므로 함께 고친다.
    excluded-user-ids:
      - 01a0945f-6d5c-7b62-8096-79fd5dbd187d
      - 01a09463-1b97-723c-86b1-8596005cfa37
      - 01a09464-847a-7d9d-b44f-53eb71710637
      - 01a0946a-05af-744e-b15a-3175707c8721
      - 01a0946a-aa90-7a3f-9956-c26d313eafea
      - 01a0946c-7ff3-71a9-ae92-b4b1a0a79641
      - 01a09492-e61e-7172-bb6f-2ad0b8f1be43
      - 01a09822-2461-7649-be66-18d1203e2871
      - 01a09de9-e8af-7034-95f8-20ec7a795745
      - 01a09dee-5ce9-726e-b49e-c4816553f681
      - 01a09e37-d7e8-77c6-8023-0fe770644536
      - 01a09e9f-b243-7a78-b790-51feeab58a15
      - 01a0a366-73e4-76a7-9acc-6d73bbf85913
      - 01a0a36c-f580-78f9-a1fd-dd29c9f47da9
      - 01a0a36e-5721-79f7-95c9-7a3126d464e9
      - 01a0a519-6cbf-7ae1-bcc4-a3710eab5ea8
      - 01a0adcf-06f2-7090-a9ca-6c21c2251e6b
      - 01a0b299-a04b-72cf-bb83-8a7da6b96b97
      - 01a0c381-9856-70a8-a598-e228cb99b028
      - 01a0c386-f89a-7db3-9701-1aea22bc9caa
      - 01a11503-09cf-7366-8d03-81e0c6e6f47b
    log-group: /chalkak/prod/application
    # prod 접근 로그에 userId가 남기 시작한 다음 날(#502). 이전 날짜는 로그 지표가 비어 있어 집계하지 않는다.
    log-metrics-start-date: 2026-10-02
    # prod 로그 그룹 보존 기간(일). 이보다 오래된 날짜는 DB 지표만 남긴다.
    log-retention-days: 60
  monitoring:
    runtime-log:
      enabled: true
  admin:
    account:
      username: ${ADMIN_USERNAME}
      password-hash: ${ADMIN_PASSWORD_HASH}
    cors:
      allowed-origins:
        - ${ADMIN_CORS_ALLOWED_ORIGIN}
    notification:
      delivery-enabled: ${ADMIN_NOTIFICATION_DELIVERY_ENABLED}
      admin-web-base-url: ${ADMIN_WEB_BASE_URL}
      slack:
        webhook-url: ${ADMIN_SLACK_WEBHOOK_URL}
  image:
    environment: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
