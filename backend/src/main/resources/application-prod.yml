# 배포 환경 프로필.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true

management:
  endpoint:
    health:
      show-details: never

chalkak:
  image:
    environment: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
