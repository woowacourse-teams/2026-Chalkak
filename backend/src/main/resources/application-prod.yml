# 배포 환경 프로필.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true

management:
  endpoint:
    health:
      show-details: never

chalkak:
  analytics:
    aggregation:
      enabled: true
    # 지표에서 뺄 팀원·테스트 계정의 회원 ID. 추가하려면 ID를 이 목록에 넣고 PR을 올려 릴리스한다.
    # 회원 ID는 비밀 값이 아니라 저장소에 둬도 된다.
    # 예)
    # excluded-user-ids:
    #   - 00000000-0000-0000-0000-000000000000
    excluded-user-ids: []
    log-group: /chalkak/prod/application
    # prod 접근 로그에 userId가 남기 시작한 다음 날(#502). 이전 날짜는 로그 지표가 비어 있어 집계하지 않는다.
    log-metrics-start-date: 2026-10-02
  monitoring:
    runtime-log:
      enabled: true
  admin:
    account:
      username: ${ADMIN_USERNAME}
      password-hash: ${ADMIN_PASSWORD_HASH}
    cors:
      allowed-origins:
        - ${ADMIN_CORS_ALLOWED_ORIGIN}
    notification:
      delivery-enabled: ${ADMIN_NOTIFICATION_DELIVERY_ENABLED}
      admin-web-base-url: ${ADMIN_WEB_BASE_URL}
      slack:
        webhook-url: ${ADMIN_SLACK_WEBHOOK_URL}
  image:
    environment: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
