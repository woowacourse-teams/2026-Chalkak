version: 0.0
os: linux

files:
  - source: application.jar
    destination: /opt/chalcak/app
  - source: deploy/compose.dev.yml
    destination: /opt/chalcak/db
  - source: deploy/scripts
    destination: /opt/chalcak/bin
  - source: deploy/systemd/chalcak-backend.service
    destination: /etc/systemd/system

file_exists_behavior: OVERWRITE

hooks:
  BeforeInstall:
    - location: deploy/scripts/stop_service.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: deploy/scripts/after_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: deploy/scripts/start_service.sh
      timeout: 240
      runas: root
  ValidateService:
    - location: deploy/scripts/validate_service.sh
      timeout: 180
      runas: root
