AWSTemplateFormatVersion: '2010-09-09'
Description: Chalkak backup completion monitor in the team account
Parameters:
  BackupBucket:
    Type: String
    Default: chalkak-backup-186101267768
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  RunPrefix:
    Type: String
    Default: chalkak/runs
    AllowedPattern: '[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*/runs'
  CodeKey:
    Type: String
    Description: ZIP object key uploaded by the administrator to BackupBucket
    AllowedPattern: 'monitor-code/[A-Za-z0-9_.-]+\.zip'
  MaxRuntimeSeconds:
    Type: Number
    MinValue: 1
    MaxValue: 42000
    Description: Must equal production BACKUP_MAX_RUNTIME_SECONDS
  CompletionMarginSeconds:
    Type: Number
    Default: 1800
    MinValue: 0
    MaxValue: 1800
  CheckSchedule1:
    Type: String
    Description: Generated by configure.py; do not edit independently of MaxRuntimeSeconds
    AllowedPattern: 'cron\([0-9]{1,2} [0-9]{1,2} \* \* \? \*\)'
  CheckSchedule2:
    Type: String
    Description: Generated by configure.py; do not edit independently of MaxRuntimeSeconds
    AllowedPattern: 'cron\([0-9]{1,2} [0-9]{1,2} \* \* \? \*\)'
  CheckSchedule3:
    Type: String
    Description: Generated by configure.py; do not edit independently of MaxRuntimeSeconds
    AllowedPattern: 'cron\([0-9]{1,2} [0-9]{1,2} \* \* \? \*\)'
  CheckSchedule4:
    Type: String
    Description: Generated by configure.py; do not edit independently of MaxRuntimeSeconds
    AllowedPattern: 'cron\([0-9]{1,2} [0-9]{1,2} \* \* \? \*\)'
  HealthWindowExpression:
    Type: String
    Description: Generated UTC health evaluation window; keep in sync with all four schedules
    MaxLength: 1024
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Verified SNS to Slack route in this region; may be empty during installation
    AllowedPattern: '(^$|^arn:aws:sns:ap-northeast-2:[0-9]{12}:[A-Za-z0-9_-]+$)'
  EnableNotifications:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
Rules:
  NotificationDestinationRequired:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Equals: [!Ref EnableNotifications, 'false']
            - Fn::Not:
                - Fn::Equals: [!Ref AlarmTopicArn, '']
        AssertDescription: EnableNotifications=true requires a verified AlarmTopicArn
Conditions:
  Notify: !And
    - !Equals [!Ref EnableNotifications, 'true']
    - !Not [!Equals [!Ref AlarmTopicArn, '']]
Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}'
      RetentionInDays: 30
  MonitorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadCompletionAndPublishHealth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${BackupBucket}'
                Condition:
                  StringLike:
                    s3:prefix: !Sub '${RunPrefix}/chalkak-backup-*'
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${BackupBucket}/${RunPrefix}/chalkak-backup-*/COMPLETE'
                  - !Sub 'arn:aws:s3:::${BackupBucket}/${RunPrefix}/chalkak-backup-*/RESULT'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Chalkak/Backup
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
  Monitor:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref AWS::StackName
      Runtime: python3.12
      Architectures: [arm64]
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt MonitorRole.Arn
      Code:
        S3Bucket: !Ref BackupBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          BACKUP_BUCKET: !Ref BackupBucket
          RUN_PREFIX: !Ref RunPrefix
          MONITOR_NAME: !Ref AWS::StackName
          BACKUP_MAX_RUNTIME_SECONDS: !Ref MaxRuntimeSeconds
          COMPLETION_MARGIN_SECONDS: !Ref CompletionMarginSeconds
  AsyncPolicy:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Monitor
      Qualifier: '$LATEST'
      MaximumEventAgeInSeconds: 600
      MaximumRetryAttempts: 1
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !GetAtt ScheduleGroup.Arn
      Policies:
        - PolicyName: InvokeOnlyMonitor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Monitor.Arn
  Schedule1:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: !Ref CheckSchedule1
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt Monitor.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 2
  Schedule2:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: !Ref CheckSchedule2
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt Monitor.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 2
  Schedule3:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: !Ref CheckSchedule3
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt Monitor.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 2
  Schedule4:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: !Ref CheckSchedule4
      ScheduleExpressionTimezone: Asia/Seoul
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt Monitor.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 600
          MaximumRetryAttempts: 2
  OverdueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: '전체 백업 완료 기록 없음. 감시 Lambda 로그의 expected_schedule과 운영 백업 저널·RESULT를 확인하세요.'
      Namespace: Chalkak/Backup
      MetricName: BackupOverdue
      Dimensions:
        - Name: Monitor
          Value: !Ref AWS::StackName
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [Notify, true, false]
      AlarmActions: !If [Notify, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
  MonitorHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: '하루 4회 감시 중 최근 3개 15분 구간 중 2개 이상 정상 기록 없음(시간밖은 정상). Scheduler·Lambda 오류/제한·S3 조회·지표 쓰기 권한을 확인하세요. 백업 자체 실패와 구분하세요.'
      Metrics:
        - Id: healthy
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: Chalkak/Backup
              MetricName: MonitorHealthy
              Dimensions:
                - Name: Monitor
                  Value: !Ref AWS::StackName
            Period: 900
            Stat: Maximum
        - Id: expected_health
          Expression: !Ref HealthWindowExpression
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      ActionsEnabled: !If [Notify, true, false]
      AlarmActions: !If [Notify, [!Ref AlarmTopicArn], !Ref AWS::NoValue]
Outputs:
  FunctionName:
    Value: !Ref Monitor
  ScheduleNames:
    Value: !Join [",", [!Ref Schedule1, !Ref Schedule2, !Ref Schedule3, !Ref Schedule4]]
  OverdueAlarmName:
    Value: !Ref OverdueAlarm
  MonitorHealthAlarmName:
    Value: !Ref MonitorHealthAlarm
