name: Android CI

on:
  pull_request:
    branches:
      - client/develop
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - client/develop
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile debug sources
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Check Kotlin code style
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-failure-reports-${{ github.run_attempt }}
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
