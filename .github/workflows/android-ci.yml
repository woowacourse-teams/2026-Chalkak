name: Android CI

on:
  pull_request:
    branches:
      - client/develop
    paths:
      - "client/android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches:
      - client/develop
    paths:
      - "client/android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile debug sources
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Check Kotlin code style
        run: ./gradlew ktlintCheck --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-failure-reports-${{ github.run_attempt }}
          path: |
            client/android/app/build/reports/**
            client/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  request-coderabbit-review:
    name: Request CodeRabbit review
    if: ${{ github.event_name == 'pull_request' && needs.verify.result == 'success' }}
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Comment review request
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const headSha = pullRequest.head.sha;
            const marker = `<!-- coderabbit-review-request:${headSha} -->`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              },
            );

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`CodeRabbit review already requested for ${headSha}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body: `@coderabbitai review\n\n${marker}`,
            });
