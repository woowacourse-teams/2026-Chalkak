name: Landing Web PR CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - landing-web/develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: landing-web

jobs:
  detect-landing-web-changes:
    name: Detect landing web changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      landing_web: ${{ steps.changes.outputs.landing_web }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect landing web changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != pull_request ]]; then
            echo "landing_web=true" >> "${GITHUB_OUTPUT}"
          else
            merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
            changed_files="$(git diff --name-only "${merge_base}" "${HEAD_SHA}" -- \
              landing-web \
              .github/workflows/landing-web-ci.yml)"

            if [[ -n "${changed_files}" ]]; then
              echo "landing_web=true" >> "${GITHUB_OUTPUT}"
            else
              echo "landing_web=false" >> "${GITHUB_OUTPUT}"
            fi
          fi

  verify:
    name: Verify landing web
    needs: detect-landing-web-changes
    if: needs.detect-landing-web-changes.outputs.landing_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  landing-web-ci:
    name: Landing Web CI
    needs:
      - detect-landing-web-changes
      - verify
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Confirm landing web verification
        working-directory: .
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.detect-landing-web-changes.result }}
          LANDING_WEB_CHANGED: ${{ needs.detect-landing-web-changes.outputs.landing_web }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail

          if [[ "${DETECTION_RESULT}" != success ]]; then
            echo "Landing web change detection failed." >&2
            exit 1
          fi

          case "${LANDING_WEB_CHANGED}" in
            true)
              if [[ "${VERIFICATION_RESULT}" != success ]]; then
                echo "Landing web verification did not succeed." >&2
                exit 1
              fi
              ;;
            false)
              if [[ "${VERIFICATION_RESULT}" != skipped ]]; then
                echo "Unexpected landing web verification result." >&2
                exit 1
              fi
              echo "No landing web changes; build and tests were skipped."
              ;;
            *)
              echo "Invalid landing web change detection output." >&2
              exit 1
              ;;
          esac
