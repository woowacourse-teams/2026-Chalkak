name: Admin Web PR CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - admin-web
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin-web

jobs:
  verify:
    name: Verify admin web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy-preview:
    name: Deploy Vercel preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59.9.1

      - name: Pull Vercel preview configuration
        run: vercel pull --yes --environment=preview --git-branch="${{ github.head_ref }}" --scope=chalkak --token="$VERCEL_TOKEN"

      - name: Build Vercel preview
        run: vercel build --scope=chalkak --token="$VERCEL_TOKEN"

      - name: Deploy Vercel preview
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --scope=chalkak --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add preview URL to job summary
        run: |
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
