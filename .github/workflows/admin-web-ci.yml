name: Admin Web PR CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - admin-web
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin-web

jobs:
  detect-admin-web-changes:
    name: Detect admin web changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      admin_web: ${{ steps.changes.outputs.admin_web }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect admin web changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != pull_request ]]; then
            echo "admin_web=true" >> "${GITHUB_OUTPUT}"
          else
            merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
            changed_files="$(git diff --name-only "${merge_base}" "${HEAD_SHA}" -- \
              admin-web \
              .github/workflows/admin-web-ci.yml)"

            if [[ -n "${changed_files}" ]]; then
              echo "admin_web=true" >> "${GITHUB_OUTPUT}"
            else
              echo "admin_web=false" >> "${GITHUB_OUTPUT}"
            fi
          fi

  verify:
    name: Verify admin web
    needs: detect-admin-web-changes
    if: needs.detect-admin-web-changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build real-mode Preview
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_APP_ENV: preview
          # Build-only example: CI never contacts a real backend or uses credentials.
          NEXT_PUBLIC_ADMIN_API_BASE_URL: https://admin-api.example.invalid/api/v1/admin
        run: npm run build

      - name: Build real-mode Production
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_ADMIN_API_BASE_URL: https://admin-api.example.invalid/api/v1/admin
        run: npm run build

      - name: Install pinned secret scanner
        env:
          SCANNER_DIR: ${{ runner.temp }}/chalkak-gitleaks
        run: |
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks

      - name: Scan tracked history and browser bundle (fully redacted)
        run: npm run check:secrets -- "${{ runner.temp }}/chalkak-gitleaks/gitleaks"

  admin-web-ci:
    name: Admin Web CI
    needs:
      - detect-admin-web-changes
      - verify
    if: always()
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Confirm admin web verification
        working-directory: .
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.detect-admin-web-changes.result }}
          ADMIN_WEB_CHANGED: ${{ needs.detect-admin-web-changes.outputs.admin_web }}
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail

          if [[ "${DETECTION_RESULT}" != success ]]; then
            echo "Admin web change detection failed." >&2
            exit 1
          fi

          case "${ADMIN_WEB_CHANGED}" in
            true)
              if [[ "${VERIFICATION_RESULT}" != success ]]; then
                echo "Admin web verification did not succeed." >&2
                exit 1
              fi
              ;;
            false)
              if [[ "${VERIFICATION_RESULT}" != skipped ]]; then
                echo "Unexpected admin web verification result." >&2
                exit 1
              fi
              echo "No admin web changes; build and tests were skipped."
              ;;
            *)
              echo "Invalid admin web change detection output." >&2
              exit 1
              ;;
          esac
