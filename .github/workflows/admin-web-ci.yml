name: Admin Web PR CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - admin-web
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin-web

jobs:
  verify:
    name: Verify admin web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build real-mode Preview
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_APP_ENV: preview
          # Build-only example: CI never contacts a real backend or uses credentials.
          NEXT_PUBLIC_ADMIN_API_BASE_URL: https://admin-api.example.invalid/api/v1/admin
        run: npm run build

      - name: Build real-mode Production
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_API_MODE: real
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_ADMIN_API_BASE_URL: https://admin-api.example.invalid/api/v1/admin
        run: npm run build

      - name: Install pinned secret scanner
        env:
          SCANNER_DIR: ${{ runner.temp }}/chalkak-gitleaks
        run: |
          mkdir -p "$SCANNER_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$SCANNER_DIR/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$SCANNER_DIR/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$SCANNER_DIR/gitleaks.tar.gz" -C "$SCANNER_DIR" gitleaks

      - name: Scan tracked history and browser bundle (fully redacted)
        run: npm run check:secrets -- "${{ runner.temp }}/chalkak-gitleaks/gitleaks"
